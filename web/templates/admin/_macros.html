{% macro icon(name) -%}
<svg class="icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
{%- if name == "dashboard" %}<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>
{%- elif name == "activity" %}<polyline points="3 12 7 12 10 4 14 20 17 12 21 12"/>
{%- elif name == "messages" %}<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
{%- elif name == "farmers" %}<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 11a3 3 0 1 0 0-6"/><path d="M22 21a6 6 0 0 0-4-5.6"/>
{%- elif name == "indicators" %}<line x1="5" y1="20" x2="5" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="19" y1="20" x2="19" y2="14"/>
{%- elif name == "kb" %}<path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="14" y2="13"/>
{%- elif name == "ok" %}<circle cx="12" cy="12" r="9"/><polyline points="8 12 11 15 16 9"/>
{%- elif name == "warn" %}<path d="M12 3 2 20h20z"/><line x1="12" y1="10" x2="12" y2="14"/><line x1="12" y1="17" x2="12" y2="17.01"/>
{%- elif name == "idle" %}<circle cx="12" cy="12" r="9"/><line x1="8" y1="12" x2="16" y2="12"/>
{%- elif name == "lock" %}<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
{%- elif name == "in" %}<line x1="19" y1="5" x2="5" y2="19"/><polyline points="5 8 5 19 16 19"/>
{%- elif name == "out" %}<line x1="5" y1="19" x2="19" y2="5"/><polyline points="8 5 19 5 19 16"/>
{%- elif name == "trash" %}<polyline points="3 6 21 6"/><path d="M8 6V4h8v2"/><path d="M6 6l1 15h10l1-15"/>
{%- elif name == "logout" %}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
{%- elif name == "empty" %}<path d="M3 13h5l2 3h4l2-3h5"/><path d="M5 13 7 5h10l2 8v6H5z"/>
{%- elif name == "error" %}<circle cx="12" cy="12" r="9"/><line x1="12" y1="7" x2="12" y2="13"/><line x1="12" y1="16" x2="12" y2="16.01"/>
{%- elif name == "link" %}<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro state(kind, title, text) -%}
<div class="state state-{{ kind }}" role="{{ 'alert' if kind == 'error' else 'status' }}">
  {{ icon(kind) }}
  <div><p class="state-title">{{ title }}</p><p class="state-text">{{ text }}</p></div>
</div>
{%- endmacro %}

{% macro csrf(token) -%}
<input type="hidden" name="csrf_token" value="{{ token }}">
{%- endmacro %}
